# App the provider authenticates as. Deploy with `shopify app deploy` from this directory; see docs/bootstrapping.md.
client_id = "<client-id>" # not a secret; replace via `shopify app config link`
name = "Terraform"
application_url = "https://shopify.dev/apps/default-app-home" # provider has no UI
embedded = false

[access_scopes]
# Full set for every resource type the provider covers; trim to what you manage. Keep in sync with docs/bootstrapping.md and shopify.app.readonly.toml.
scopes = "write_cart_transforms,write_checkout_and_accounts_configurations,write_checkout_branding_settings,write_content,write_customers,write_delivery_customizations,write_discounts,write_draft_orders,write_files,write_fulfillment_constraint_rules,write_fulfillments,write_inventory,write_legal_policies,write_locales,write_locations,write_markets,write_metaobject_definitions,write_metaobjects,write_online_store_navigation,write_orders,write_payment_customizations,write_privacy_settings,write_products,write_publications,write_purchase_options,write_shipping,write_translations,write_validations"
use_legacy_install_flow = false

[auth]
redirect_urls = ["https://shopify.dev/apps/default-app-home"]

[webhooks]
api_version = "2026-10"

[build]
include_config_on_deploy = true # without it, deploy re-releases the dashboard config and ignores this file
