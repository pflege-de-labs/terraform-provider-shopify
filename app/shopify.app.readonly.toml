# Read-only app for `terraform plan` (CI plan jobs). Deploy with `shopify app deploy --config readonly`; see docs/bootstrapping.md.
client_id = "<client-id>" # not a secret; replace via `shopify app config link --config readonly`
name = "Terraform (read-only)"
application_url = "https://shopify.dev/apps/default-app-home" # provider has no UI
embedded = false

[access_scopes]
# Read counterparts of shopify.app.toml; keep in sync with docs/bootstrapping.md.
scopes = "read_cart_transforms,read_checkout_and_accounts_configurations,read_checkout_branding_settings,read_content,read_customers,read_delivery_customizations,read_discounts,read_draft_orders,read_files,read_fulfillment_constraint_rules,read_fulfillments,read_inventory,read_legal_policies,read_locales,read_locations,read_markets,read_metaobject_definitions,read_metaobjects,read_online_store_navigation,read_orders,read_payment_customizations,read_privacy_settings,read_products,read_publications,read_purchase_options,read_shipping,read_translations,read_validations"
use_legacy_install_flow = false

[auth]
redirect_urls = ["https://shopify.dev/apps/default-app-home"]

[webhooks]
api_version = "2026-10"
