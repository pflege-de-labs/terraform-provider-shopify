fragment MetaobjectFields on Metaobject {
  id
  type
  handle
  displayName
  updatedAt
  fields {
    key
    type
    value
  }
  capabilities {
    publishable {
      status
    }
  }
}

query GetMetaobjectByHandle(
  $objectType: String!
  $handle: String!
) {
  metaobjectByHandle(handle: {type: $objectType, handle: $handle}) {
    ...MetaobjectFields
  }
}

# Shopify rejects an explicit null onlineStore on a type without that capability.
# @genqlient(for: "MetaobjectCapabilityDataInput.onlineStore", omitempty: true)
# @genqlient(for: "MetaobjectCreateInput.handle", omitempty: true)
# @genqlient(for: "MetaobjectCreateInput.values", omitempty: true)
# @genqlient(for: "MetaobjectCreateInput.fields", omitempty: true)
mutation CreateMetaobject(
  $metaobject: MetaobjectCreateInput!
) {
  metaobjectCreate(metaobject: $metaobject) {
    metaobject {
      ...MetaobjectFields
    }
    userErrors {
      field
      message
      code
      elementKey
    }
  }
}

query GetMetaobject(
  $id: ID!
) {
  metaobject(id: $id) {
    ...MetaobjectFields
  }
}

# 50 per page keeps the cost low for types with many fields.
query ListMetaobjects($objectType: String!, $after: String) {
  metaobjects(type: $objectType, first: 50, after: $after) {
    # @genqlient(flatten: true)
    nodes {
      ...MetaobjectFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Only changed values are sent; unset inputs must be omitted, not sent as null.
# @genqlient(for: "MetaobjectUpdateInput.handle", omitempty: true)
# @genqlient(for: "MetaobjectUpdateInput.fields", omitempty: true)
# @genqlient(for: "MetaobjectUpdateInput.capabilities", omitempty: true)
# @genqlient(for: "MetaobjectUpdateInput.redirectNewHandle", omitempty: true)
# @genqlient(for: "MetaobjectUpdateInput.values", omitempty: true)
# @genqlient(for: "MetaobjectCapabilityDataInput.publishable", omitempty: true)
# @genqlient(for: "MetaobjectCapabilityDataInput.onlineStore", omitempty: true)
mutation UpdateMetaobject(
  $id: ID!
  $metaobject: MetaobjectUpdateInput!
) {
  metaobjectUpdate(id: $id, metaobject: $metaobject) {
    metaobject {
      ...MetaobjectFields
    }
    userErrors {
      field
      message
      code
      elementKey
    }
  }
}

mutation DeleteMetaobject(
  $id: ID!
) {
  metaobjectDelete(id: $id) {
    deletedId
    userErrors {
      field
      message
      code
    }
  }
}
