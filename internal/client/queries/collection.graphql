mutation UpdateCollection(
  $collection: CollectionUpdateInput!
) {
  collectionUpdate(collection: $collection) {
    collection {
      ...CollectionFields
    }
    userErrors {
      field
      message
    }
  }
}

mutation DeleteCollection(
  $id: ID!
) {
  collectionDelete(input: { id: $id }) {
    deletedCollectionId
    userErrors {
      field
      message
    }
  }
}
