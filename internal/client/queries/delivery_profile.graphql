fragment DeliveryMethodFields on DeliveryMethodDefinition {
  id
  name
  description
  active
  rateProvider {
    __typename
    ... on DeliveryRateDefinition {
      id
      price {
        amount
        currencyCode
      }
    }
  }
  methodConditions {
    id
    field
    operator
    conditionCriteria {
      __typename
      ... on MoneyV2 {
        amount
        currencyCode
      }
      ... on Weight {
        unit
        value
      }
    }
  }
}

# Page sizes keep the query under Shopify's single-query cost limit; truncation is reported, not ignored.
query GetDeliveryProfile(
  $id: ID!
) {
  deliveryProfile(id: $id) {
    id
    name
    default
    profileLocationGroups {
      locationGroup {
        id
        locations(first: 50) {
          nodes {
            id
          }
          pageInfo {
            hasNextPage
          }
        }
      }
      locationGroupZones(first: 25) {
        nodes {
          zone {
            id
            name
            countries {
              code {
                countryCode
                restOfWorld
              }
            }
          }
          methodDefinitions(first: 25) {
            nodes {
              ...DeliveryMethodFields
            }
            pageInfo {
              hasNextPage
            }
          }
        }
        pageInfo {
          hasNextPage
        }
      }
    }
  }
}

query ListDeliveryProfiles {
  deliveryProfiles(first: 50) {
    nodes {
      id
      default
    }
  }
}

