fragment MarketFields on Market {
  id
  handle
  name
  status
  conditions {
    regionsCondition {
      regions(first: 250) {
        nodes {
          ... on MarketRegionCountry {
            code
          }
        }
      }
    }
  }
  currencySettings {
    baseCurrency {
      currencyCode
    }
    localCurrencies
  }
  webPresences(first: 250) {
    nodes {
      id
    }
  }
  catalogs(first: 250) {
    nodes {
      id
    }
  }
}

query GetMarket(
  $id: ID!
) {
  market(id: $id) {
    ...MarketFields
  }
}

# markets(query:) can't filter by handle, so lookups by handle page through all markets.
query ListMarkets(
  $after: String
) {
  markets(first: 250, after: $after) {
    nodes {
      ...MarketFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

