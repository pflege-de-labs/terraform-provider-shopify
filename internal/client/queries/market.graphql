mutation UpdateMarket(
  $id: ID!
  $input: MarketUpdateInput!
) {
  marketUpdate(id: $id, input: $input) {
    market {
      ...MarketFields
    }
    userErrors {
      field
      message
    }
  }
}

mutation DeleteMarket(
  $id: ID!
) {
  marketDelete(id: $id) {
    deletedId
    userErrors {
      field
      message
    }
  }
}
