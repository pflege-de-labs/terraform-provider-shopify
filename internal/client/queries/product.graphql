fragment ProductFields on Product {
  id
  handle
  title
  status
  descriptionHtml
  vendor
  productType
  category {
    id
  }
  tags
  seo {
    title
    description
  }
  templateSuffix
  isGiftCard
  hasOnlyDefaultVariant
  ...PublicationsOfPublishable
  # 20 keeps a list page of 50 products under the cost limit (947 of 1,000); GetProductMedia pages the rest.
  media(first: 20) {
    # @genqlient(flatten: true)
    nodes {
      ...MediaID
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
  options {
    id
    name
    linkedMetafield {
      namespace
      key
    }
    optionValues {
      id
      name
    }
  }
  variants(first: 250) {
    nodes {
      ...VariantFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Every Media type (MediaImage, Video, Model3d, ExternalVideo) is a File, so the GID is a file ID.
fragment MediaID on Media {
  id
}

# TODO(verify): whether reading inventoryItem needs read_inventory; every scope is granted on the dev store.
fragment VariantFields on ProductVariant {
  id
  price
  compareAtPrice
  sku
  barcodes(first: 20) {
    nodes {
      value
      type
    }
  }
  inventoryPolicy
  taxable
  selectedOptions {
    name
    value
  }
  inventoryItem {
    id
    tracked
    requiresShipping
    measurement {
      weight {
        value
        unit
      }
    }
  }
}

query GetProduct(
  $id: ID!
) {
  product(id: $id) {
    ...ProductFields
  }
}

# productByHandle is deprecated and products(query:) is search-indexed, so this is the exact handle lookup.
query GetProductByHandle(
  $handle: String!
) {
  productByIdentifier(identifier: { handle: $handle }) {
    ...ProductFields
  }
}

# Pages variants after the first 250 that ProductFields carries.
query GetProductVariants(
  $id: ID!
  $after: String
) {
  product(id: $id) {
    variants(first: 250, after: $after) {
      nodes {
        ...VariantFields
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# Pages media after the first 20 that ProductFields carries.
query GetProductMedia(
  $id: ID!
  $after: String
) {
  product(id: $id) {
    media(first: 250, after: $after) {
      # @genqlient(flatten: true)
      nodes {
        ...MediaID
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

query ListProducts(
  $after: String
) {
  products(first: 50, after: $after) {
    nodes {
      ...ProductFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

