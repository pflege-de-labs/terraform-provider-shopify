# An explicit null compareDigest means "only create": the update of an existing metafield fails with a stale-digest error.
# @genqlient(for: "MetafieldsSetInput.compareDigest", omitempty: true)
mutation SetMetafields(
  $metafields: [MetafieldsSetInput!]!
) {
  metafieldsSet(metafields: $metafields) {
    metafields {
      key
    }
    userErrors {
      field
      message
      code
      elementIndex
    }
  }
}

mutation DeleteMetafields(
  $metafields: [MetafieldIdentifierInput!]!
) {
  metafieldsDelete(metafields: $metafields) {
    userErrors {
      field
      message
    }
  }
}
