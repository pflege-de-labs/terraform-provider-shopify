# Pages a product's metafields; the shared internal/metafields package takes the page function, so other owners add their own query.
query GetProductMetafields(
  $id: ID!
  $after: String
) {
  product(id: $id) {
    metafields(first: 250, after: $after) {
      nodes {
        namespace
        key
        type
        value
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

