fragment DiscountCombinesWithFields on DiscountCombinesWith {
  productDiscounts
  orderDiscounts
  shippingDiscounts
}

fragment DiscountContextFields on DiscountContext {
  __typename
  ... on DiscountCustomerSegments {
    segments {
      id
    }
  }
  ... on DiscountMarkets {
    markets(first: 250) {
      nodes {
        id
      }
      pageInfo {
        hasNextPage
      }
    }
  }
  ... on DiscountContextUnknown {
    contextType
  }
}

fragment DiscountItemsFields on DiscountItems {
  __typename
  ... on DiscountProducts {
    products(first: 250) {
      nodes {
        id
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
    productVariants(first: 250) {
      nodes {
        id
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
  ... on DiscountCollections {
    collections(first: 250) {
      nodes {
        id
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

fragment DiscountCustomerGetsFields on DiscountCustomerGets {
  value {
    __typename
    ... on DiscountPercentage {
      percentage
    }
    ... on DiscountAmount {
      amount {
        amount
      }
      appliesOnEachItem
    }
  }
  # @genqlient(flatten: true)
  items {
    ...DiscountItemsFields
  }
}

fragment DiscountMinimumFields on DiscountMinimumRequirement {
  __typename
  ... on DiscountMinimumSubtotal {
    greaterThanOrEqualToSubtotal {
      amount
    }
  }
  ... on DiscountMinimumQuantity {
    greaterThanOrEqualToQuantity
  }
}

# Code and automatic basic discounts share the flattened sub-objects, so one mapping reads both.
fragment DiscountNodeFields on DiscountNode {
  id
  discount {
    __typename
    ... on DiscountCodeBasic {
      title
      startsAt
      endsAt
      status
      usageLimit
      appliesOncePerCustomer
      codesCount {
        count
      }
      codes(first: 1) {
        nodes {
          code
        }
      }
      # @genqlient(flatten: true)
      combinesWith {
        ...DiscountCombinesWithFields
      }
      # @genqlient(flatten: true)
      context {
        ...DiscountContextFields
      }
      # @genqlient(flatten: true)
      customerGets {
        ...DiscountCustomerGetsFields
      }
      # @genqlient(flatten: true)
      minimumRequirement {
        ...DiscountMinimumFields
      }
    }
    ... on DiscountAutomaticBasic {
      title
      startsAt
      endsAt
      status
      # @genqlient(flatten: true)
      combinesWith {
        ...DiscountCombinesWithFields
      }
      # @genqlient(flatten: true)
      context {
        ...DiscountContextFields
      }
      # @genqlient(flatten: true)
      customerGets {
        ...DiscountCustomerGetsFields
      }
      # @genqlient(flatten: true)
      minimumRequirement {
        ...DiscountMinimumFields
      }
    }
    # Titles of the other automatic kinds, so a title lookup can say which resource owns a match.
    ... on DiscountAutomaticBxgy {
      title
    }
    ... on DiscountAutomaticFreeShipping {
      title
    }
    ... on DiscountAutomaticApp {
      title
    }
  }
}

fragment DiscountUserErrorFields on DiscountUserError {
  field
  message
  code
  extraInfo
}

# discountNode is not deprecated, unlike codeDiscountNode and automaticDiscountNode.
query GetDiscount(
  $id: ID!
) {
  discountNode(id: $id) {
    ...DiscountNodeFields
  }
}

# Case-insensitive; Read continues by GID.
query GetDiscountByCode(
  $code: String!
) {
  codeDiscountNodeByCode(code: $code) {
    id
    codeDiscount {
      __typename
    }
  }
}

# Pages item selections after the first 250 that DiscountNodeFields carries; raw, as both branches share one decoder.
query GetDiscountItemsPage(
  $id: ID!
  $products: String
  $variants: String
  $collections: String
) {
  discountNode(id: $id) {
    discount {
      __typename
      ... on DiscountCodeBasic {
        customerGets {
          # @genqlient(bind: "encoding/json.RawMessage")
          items {
            __typename
            ... on DiscountProducts {
              products(first: 250, after: $products) {
                nodes {
                  id
                }
                pageInfo {
                  hasNextPage
                  endCursor
                }
              }
              productVariants(first: 250, after: $variants) {
                nodes {
                  id
                }
                pageInfo {
                  hasNextPage
                  endCursor
                }
              }
            }
            ... on DiscountCollections {
              collections(first: 250, after: $collections) {
                nodes {
                  id
                }
                pageInfo {
                  hasNextPage
                  endCursor
                }
              }
            }
          }
        }
      }
      ... on DiscountAutomaticBasic {
        customerGets {
          # @genqlient(bind: "encoding/json.RawMessage")
          items {
            __typename
            ... on DiscountProducts {
              products(first: 250, after: $products) {
                nodes {
                  id
                }
                pageInfo {
                  hasNextPage
                  endCursor
                }
              }
              productVariants(first: 250, after: $variants) {
                nodes {
                  id
                }
                pageInfo {
                  hasNextPage
                  endCursor
                }
              }
            }
            ... on DiscountCollections {
              collections(first: 250, after: $collections) {
                nodes {
                  id
                }
                pageInfo {
                  hasNextPage
                  endCursor
                }
              }
            }
          }
        }
      }
    }
  }
}

# Requested cost with items and markets at first 250 was 359 for 50 nodes (§9p).
query ListDiscounts(
  $after: String
  $query: String
) {
  discountNodes(first: 50, after: $after, query: $query) {
    nodes {
      ...DiscountNodeFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

