fragment DiscountCombinesWithFields on DiscountCombinesWith {
  productDiscounts
  orderDiscounts
  shippingDiscounts
}

fragment DiscountContextFields on DiscountContext {
  __typename
  ... on DiscountCustomerSegments {
    segments {
      id
    }
  }
  ... on DiscountMarkets {
    markets(first: 250) {
      nodes {
        id
      }
      pageInfo {
        hasNextPage
      }
    }
  }
  ... on DiscountContextUnknown {
    contextType
  }
}

fragment DiscountItemsFields on DiscountItems {
  __typename
  ... on DiscountProducts {
    products(first: 250) {
      nodes {
        id
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
    productVariants(first: 250) {
      nodes {
        id
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
  ... on DiscountCollections {
    collections(first: 250) {
      nodes {
        id
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

fragment DiscountCustomerGetsFields on DiscountCustomerGets {
  value {
    __typename
    ... on DiscountPercentage {
      percentage
    }
    ... on DiscountAmount {
      amount {
        amount
      }
      appliesOnEachItem
    }
    ... on DiscountOnQuantity {
      quantity {
        quantity
      }
      effect {
        __typename
        ... on DiscountPercentage {
          percentage
        }
        ... on DiscountAmount {
          amount {
            amount
          }
        }
      }
    }
  }
  # @genqlient(flatten: true)
  items {
    ...DiscountItemsFields
  }
}

fragment DiscountCustomerBuysFields on DiscountCustomerBuys {
  value {
    __typename
    ... on DiscountQuantity {
      quantity
    }
    ... on DiscountPurchaseAmount {
      amount
    }
  }
  # @genqlient(flatten: true)
  items {
    ...DiscountItemsFields
  }
}

fragment DiscountDestinationFields on DiscountShippingDestinationSelection {
  __typename
  ... on DiscountCountries {
    countries
  }
  ... on DiscountCountryAll {
    allCountries
  }
}

fragment DiscountMinimumFields on DiscountMinimumRequirement {
  __typename
  ... on DiscountMinimumSubtotal {
    greaterThanOrEqualToSubtotal {
      amount
    }
  }
  ... on DiscountMinimumQuantity {
    greaterThanOrEqualToQuantity
  }
}

# Code and automatic basic discounts share the flattened sub-objects, so one mapping reads both.
fragment DiscountNodeFields on DiscountNode {
  id
  discount {
    __typename
    ... on DiscountCodeBasic {
      title
      startsAt
      endsAt
      status
      usageLimit
      appliesOncePerCustomer
      codesCount {
        count
      }
      codes(first: 1) {
        nodes {
          code
        }
      }
      # @genqlient(flatten: true)
      combinesWith {
        ...DiscountCombinesWithFields
      }
      # @genqlient(flatten: true)
      context {
        ...DiscountContextFields
      }
      # @genqlient(flatten: true)
      customerGets {
        ...DiscountCustomerGetsFields
      }
      # @genqlient(flatten: true)
      minimumRequirement {
        ...DiscountMinimumFields
      }
    }
    ... on DiscountAutomaticBasic {
      title
      startsAt
      endsAt
      status
      # @genqlient(flatten: true)
      combinesWith {
        ...DiscountCombinesWithFields
      }
      # @genqlient(flatten: true)
      context {
        ...DiscountContextFields
      }
      # @genqlient(flatten: true)
      customerGets {
        ...DiscountCustomerGetsFields
      }
      # @genqlient(flatten: true)
      minimumRequirement {
        ...DiscountMinimumFields
      }
    }
    # Free shipping and BXGY carry their own fields; app discounts only a title, so a title lookup or a list skip can name them.
    ... on DiscountCodeBxgy {
      title
      startsAt
      endsAt
      status
      usageLimit
      appliesOncePerCustomer
      codesCount {
        count
      }
      codes(first: 1) {
        nodes {
          code
        }
      }
      usesPerOrderLimit
      # @genqlient(flatten: true)
      customerBuys {
        ...DiscountCustomerBuysFields
      }
      # @genqlient(flatten: true)
      customerGets {
        ...DiscountCustomerGetsFields
      }
      # @genqlient(flatten: true)
      combinesWith {
        ...DiscountCombinesWithFields
      }
      # @genqlient(flatten: true)
      context {
        ...DiscountContextFields
      }
    }
    ... on DiscountCodeFreeShipping {
      title
      startsAt
      endsAt
      status
      usageLimit
      appliesOncePerCustomer
      codesCount {
        count
      }
      codes(first: 1) {
        nodes {
          code
        }
      }
      appliesOnOneTimePurchase
      appliesOnSubscription
      maximumShippingPrice {
        amount
      }
      # @genqlient(flatten: true)
      destinationSelection {
        ...DiscountDestinationFields
      }
      # @genqlient(flatten: true)
      minimumRequirement {
        ...DiscountMinimumFields
      }
      # @genqlient(flatten: true)
      combinesWith {
        ...DiscountCombinesWithFields
      }
      # @genqlient(flatten: true)
      context {
        ...DiscountContextFields
      }
    }
    ... on DiscountCodeApp {
      title
    }
    ... on DiscountAutomaticBxgy {
      title
      startsAt
      endsAt
      status
      usesPerOrderLimit
      # @genqlient(flatten: true)
      customerBuys {
        ...DiscountCustomerBuysFields
      }
      # @genqlient(flatten: true)
      customerGets {
        ...DiscountCustomerGetsFields
      }
      # @genqlient(flatten: true)
      combinesWith {
        ...DiscountCombinesWithFields
      }
      # @genqlient(flatten: true)
      context {
        ...DiscountContextFields
      }
    }
    ... on DiscountAutomaticFreeShipping {
      title
      startsAt
      endsAt
      status
      appliesOnOneTimePurchase
      appliesOnSubscription
      maximumShippingPrice {
        amount
      }
      # @genqlient(flatten: true)
      destinationSelection {
        ...DiscountDestinationFields
      }
      # @genqlient(flatten: true)
      minimumRequirement {
        ...DiscountMinimumFields
      }
      # @genqlient(flatten: true)
      combinesWith {
        ...DiscountCombinesWithFields
      }
      # @genqlient(flatten: true)
      context {
        ...DiscountContextFields
      }
    }
    ... on DiscountAutomaticApp {
      title
    }
  }
}

fragment DiscountUserErrorFields on DiscountUserError {
  field
  message
  code
  extraInfo
}

# discountNode is not deprecated, unlike codeDiscountNode and automaticDiscountNode.
query GetDiscount(
  $id: ID!
) {
  discountNode(id: $id) {
    ...DiscountNodeFields
  }
}

# Case-insensitive; Read continues by GID.
query GetDiscountByCode(
  $code: String!
) {
  codeDiscountNodeByCode(code: $code) {
    id
    codeDiscount {
      __typename
    }
  }
}

# Pages item selections after the first 250 that DiscountNodeFields carries; raw, as both branches share one decoder.
query GetDiscountItemsPage(
  $id: ID!
  $products: String
  $variants: String
  $collections: String
) {
  discountNode(id: $id) {
    discount {
      __typename
      ... on DiscountCodeBasic {
        customerGets {
          # @genqlient(bind: "encoding/json.RawMessage")
          items {
            __typename
            ... on DiscountProducts {
              products(first: 250, after: $products) {
                nodes {
                  id
                }
                pageInfo {
                  hasNextPage
                  endCursor
                }
              }
              productVariants(first: 250, after: $variants) {
                nodes {
                  id
                }
                pageInfo {
                  hasNextPage
                  endCursor
                }
              }
            }
            ... on DiscountCollections {
              collections(first: 250, after: $collections) {
                nodes {
                  id
                }
                pageInfo {
                  hasNextPage
                  endCursor
                }
              }
            }
          }
        }
      }
      ... on DiscountAutomaticBasic {
        customerGets {
          # @genqlient(bind: "encoding/json.RawMessage")
          items {
            __typename
            ... on DiscountProducts {
              products(first: 250, after: $products) {
                nodes {
                  id
                }
                pageInfo {
                  hasNextPage
                  endCursor
                }
              }
              productVariants(first: 250, after: $variants) {
                nodes {
                  id
                }
                pageInfo {
                  hasNextPage
                  endCursor
                }
              }
            }
            ... on DiscountCollections {
              collections(first: 250, after: $collections) {
                nodes {
                  id
                }
                pageInfo {
                  hasNextPage
                  endCursor
                }
              }
            }
          }
        }
      }
    }
  }
}

# Requested cost with items and markets at first 250 was 359 for 50 nodes (§9p).
query ListDiscounts(
  $after: String
  $query: String
) {
  discountNodes(first: 50, after: $after, query: $query) {
    nodes {
      ...DiscountNodeFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

