bindings:
  # Shopify serializes UnsignedInt64 as a JSON string.
  UnsignedInt64:
    type: string
  # Decimal is a JSON string; kept as string to avoid float rounding.
  Decimal:
    type: string
  # URL is a plain string; kept as string to avoid parse failures on odd values.
